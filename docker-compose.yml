# O Odeon, lado servidor: a API e o banco.
#
# ## Por que ele subia três coisas e agora sobe duas
#
# Até a R51 um `docker-compose.yml` só subia API, banco **e** a interface —
# porque as três moravam no mesmo repositório. Elas deixaram de morar, e este
# arquivo era o **único** laço que existia entre elas: não há tipo
# compartilhado, não há código gerado, não há import cruzado. Rachá-lo em dois
# foi literalmente apagar um serviço de cada lado.
#
# Quem quiser só o servidor roda este arquivo e tem um Odeon inteiro
# respondendo em :8080 (e :8443 com TLS). A interface é um cliente da API,
# como qualquer outro — ver o repositório `odeon-client`.

name: odeon

services:
  db:
    # pgvector/pgvector:pg18 é a imagem oficial do Postgres 18 com a extensão
    # `vector` já compilada. Mesma convenção de volume do postgres:18.
    image: pgvector/pgvector:pg18
    container_name: odeon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odeon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odeon}
      POSTGRES_DB: odeon
    ports:
      # Só loopback. O banco não tem por que ser alcançável pela LAN nem pela
      # tailnet — quem fala com ele é o container `api`, pela rede interna do
      # compose, que não passa por aqui.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # PG18+ quer o mount na raiz, não em /data — ele cria o subdiretório por
      # major version, o que deixa `pg_upgrade --link` viável no futuro.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odeon -d odeon"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      target: dev
    container_name: odeon-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://odeon:${POSTGRES_PASSWORD:-odeon}@db:5432/odeon
      ODEON_BIND: 0.0.0.0:8080
      # Todas as pastas que o container enxerga. A interface só deixa criar
      # biblioteca dentro delas.
      ODEON_MEDIA_ROOTS: /media,/media2,/media3
      ODEON_CACHE_DIR: /cache
      # Sem isso, filmes e séries não são identificados. AniList (anime) funciona sem chave.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Origens EXTRAS pro CORS. localhost e o próprio host da requisição já
      # passam sozinhos — isto é só pra quando o front vier de outro nome.
      ODEON_ALLOWED_ORIGINS: ${ODEON_ALLOWED_ORIGINS:-}
      # TLS. Vazios = só HTTP. O caminho recomendado é `tailscale cert`,
      # que emite um Let's Encrypt de verdade — ver README.
      ODEON_TLS_CERT: ${ODEON_TLS_CERT:-}
      ODEON_TLS_KEY: ${ODEON_TLS_KEY:-}
      ODEON_HTTPS_BIND: 0.0.0.0:8443
      ODEON_HTTPS_ONLY: ${ODEON_HTTPS_ONLY:-false}
      RUST_LOG: ${RUST_LOG:-odeon=debug,tower_http=info,info}
      RUST_BACKTRACE: "1"
    ports:
      - "${API_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      # `z` = rótulo SELinux compartilhado (container_file_t). Sem ele, no
      # Fedora, o container sobe mas a pasta aparece VAZIA, sem erro claro.
      - ./backend:/app:z
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
      # Os discos de mídia NÃO levam `z`: são exFAT, que não guarda xattr, então
      # não há rótulo por arquivo pra aplicar — o relabel falharia. O rótulo
      # deles vem do mount (`context=` no /etc/fstab). Ver README desta máquina.
      # LEITURA E ESCRITA desde a R10, e a troca é consciente.
      #
      # Eram `:ro`, e o `:ro` era uma garantia real: nenhum bug e nenhuma sessão
      # de admin vazada alcançava a mídia. Trocar por escrita foi decisão de
      # quem administra este servidor, pra que "apagar do disco" na gaveta de
      # gerenciar exista de verdade em vez de existir desabilitado.
      #
      # O que segura o risco agora é código, não montagem: só admin apaga, a
      # confirmação é por digitação com a lista de arquivos na frente, e o
      # `GET /api/storage` testa escrita de verdade em vez de deduzir. Voltar
      # pra `:ro` é acrescentar `:ro` de novo aqui e `docker compose up -d` —
      # o botão volta a nascer desabilitado, explicando o porquê.
      - ${MEDIA_PATH}:/media
      # Discos extras, opcionais. Apontam pra si mesmos quando não usados —
      # o servidor descarta raiz que não existe ou está vazia.
      - ${MEDIA_PATH_2:-${MEDIA_PATH}}:/media2
      - ${MEDIA_PATH_3:-${MEDIA_PATH}}:/media3
      # Onde ficam cert.crt/cert.key. Read-only: o servidor só lê.
      - ./certs:/certs:ro,z
      - cache:/cache
    # GPU por CDI. A detecção de encoder roda no BOOT
    # (backend/src/transcode/hwaccel.rs), então a placa precisa estar visível
    # antes de o processo subir.
    #
    # Por que CDI e não `deploy.resources.reservations.devices` com
    # `capabilities: [gpu, video]`: aquela forma exige o runtime `nvidia`
    # registrado no daemon, o que obriga a reiniciar o dockerd — e nesta máquina
    # isso derruba ~35 containers (Jellyfin, ErsatzTV, os stacks de trabalho).
    # O Docker 29 lê CDI nativamente, sem daemon.json e sem restart.
    #
    # O spec /etc/cdi/nvidia.yaml já injeta libnvidia-encode.so.1 e libcuda.so.1
    # — que é o conteúdo da capability `video`, a que falta quando se pede só
    # `gpu` e o h264_nvenc aparece em `ffmpeg -encoders` mas morre no encode.
    devices:
      - nvidia.com/gpu=all

volumes:
  db-data:
  cargo-registry:
  cargo-target:
  cache:
