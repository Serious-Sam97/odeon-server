[package]
name = "odeon"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
# tls-openssl e não tls-rustls: o provider padrão do rustls 0.23 é o aws-lc-rs,
# que exige cmake na imagem de build. O openssl já está lá por causa do reqwest.
axum-server = { version = "0.7", features = ["tls-openssl"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
regex = "1"
once_cell = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
# native-tls (OpenSSL) em vez de rustls: o provider padrão do rustls 0.23 é o
# aws-lc-rs, que exige cmake/nasm na imagem de build. libssl-dev é um apt e pronto.
reqwest = { version = "0.12", features = ["json"] }
strsim = "0.11"
deunicode = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.dev]
# builds mais rápidos no loop de dev; sobe pra 1 se precisar debugar dep
opt-level = 0
debug = 1
